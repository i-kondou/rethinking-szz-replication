[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-message-scrubber"
version = "0.2.0"
description = "Build and verify isolated Git repositories without commit messages"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.scripts]
git-message-scrubber = "git_message_scrubber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
